name: Update README cards

on:
  workflow_dispatch:
  schedule:
    - cron: "11 4 * * *"
  push:
    branches: [main]
    paths:
      - ".github/workflows/readme-cards.yml"

permissions:
  contents: write

jobs:
  cards:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Refresh GitHub stats cards
        env:
          USERNAME: ${{ github.repository_owner }}
        run: |
          mkdir -p profile
          download() {
            local url="$1"
            local out="$2"
            if curl -fsSL --retry 3 --retry-delay 2 "$url" -o "$out.tmp"; then
              if grep -q "<svg" "$out.tmp"; then
                mv "$out.tmp" "$out"
                echo "updated $out"
                return 0
              fi
            fi
            rm -f "$out.tmp"
            echo "skipped $out (source unavailable)"
            return 0
          }

          download "https://streak-stats.demolab.com/?user=${USERNAME}&theme=tokyonight&hide_border=true" profile/streak.svg
          download "https://github-profile-summary-cards.vercel.app/api/cards/stats?username=${USERNAME}&theme=tokyonight" profile/stats.svg
          download "https://github-profile-summary-cards.vercel.app/api/cards/repos-per-language?username=${USERNAME}&theme=tokyonight" profile/repos-per-language.svg
          download "https://github-profile-summary-cards.vercel.app/api/cards/most-commit-language?username=${USERNAME}&theme=tokyonight" profile/most-commit-language.svg
          download "https://github-profile-summary-cards.vercel.app/api/cards/profile-details?username=${USERNAME}&theme=tokyonight" profile/profile-details.svg
          download "https://github-profile-summary-cards.vercel.app/api/cards/productive-time?username=${USERNAME}&theme=tokyonight" profile/productive-time.svg

      - name: Commit cards
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile
          git diff --cached --quiet || git commit -m "chore: refresh README cards"
          git push
